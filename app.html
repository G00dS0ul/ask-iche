<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ask Iche 🌿</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌿</text></svg>">
<style>
  :root { --bg:#f6f8f5; --card:#fff; --ink:#1f2a24; --mute:#6b7a71; --line:#e3e9e4; --green:#2f8f5b; --green-bg:#e9f6ee;
          --blue:#2f6fb3; --blue-bg:#eaf2fb; --amber:#a86a00; --amber-bg:#fff5e0; --red:#b3261e; --red-bg:#fdecea; --radius:14px; }
  * { box-sizing:border-box; }
  body { margin:0; font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; background:var(--bg); color:var(--ink); }
  header { display:flex; align-items:center; gap:12px; padding:18px 28px; background:#fff; border-bottom:1px solid var(--line); position:sticky; top:0; z-index:5; }
  header h1 { font-size:20px; margin:0; }
  header .sub { color:var(--mute); font-size:14px; }
  .pill { margin-left:auto; font-size:13px; padding:6px 12px; border-radius:999px; background:var(--green-bg); color:var(--green); cursor:pointer; border:0; }
  .pill.off { background:#eee; color:#666; }
  main { max-width:880px; margin:0 auto; padding:24px 20px 80px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:var(--radius); padding:18px 20px; margin-bottom:16px; box-shadow:0 1px 2px rgba(0,0,0,.03); }
  .card h2 { font-size:15px; margin:0 0 12px; color:var(--mute); font-weight:600; text-transform:uppercase; letter-spacing:.04em; }
  .row { display:flex; gap:10px; flex-wrap:wrap; align-items:center; }
  input[type=text] { flex:1; min-width:220px; font:inherit; padding:10px 14px; border:1px solid var(--line); border-radius:10px; background:#fbfcfb; }
  input[type=text]:focus { outline:2px solid #bfe3cd; border-color:var(--green); }
  summary { outline:none; border-radius:6px; } summary:focus-visible { outline:2px solid #bfe3cd; outline-offset:2px; }
  button { font:inherit; border:1px solid var(--line); background:#fff; padding:9px 16px; border-radius:10px; cursor:pointer; }
  button:hover:not(:disabled) { border-color:#b9c7be; background:#fafcfb; }
  button:disabled { opacity:.5; cursor:not-allowed; }
  button.primary { background:var(--green); color:#fff; border-color:var(--green); }
  button.primary:hover:not(:disabled) { background:#277a4d; }
  button.danger { background:var(--red); color:#fff; border-color:var(--red); }
  button.ghost { border-color:transparent; color:var(--mute); }
  .chips { display:flex; gap:8px; flex-wrap:wrap; margin-top:10px; }
  .chip { font-size:13px; padding:4px 10px; border-radius:999px; background:#f0f3f1; border:1px solid var(--line); cursor:pointer; }
  .actions { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:10px; margin-bottom:12px; }
  .action { text-align:left; padding:12px 14px; }
  .action b { display:block; } .action span { font-size:13px; color:var(--mute); }
  .facts { list-style:none; padding:0; margin:0; }
  .facts li { padding:4px 0 4px 26px; position:relative; }
  .facts li::before { content:"•"; position:absolute; left:10px; color:var(--mute); }
  .warn { background:var(--amber-bg); color:var(--amber); padding:10px 14px; border-radius:10px; margin-top:10px; }
  .warn.block { background:var(--red-bg); color:var(--red); font-weight:600; } .banner.stop { background:var(--red-bg); color:var(--red); }
  .msg { padding:10px 14px; border-radius:10px; margin:0 0 12px; }
  .msg.ok { background:var(--green-bg); color:var(--green); } .msg.warn { background:var(--amber-bg); color:var(--amber); }
  .msg.error { background:var(--red-bg); color:var(--red); } .msg.info { background:#f0f3f1; color:var(--mute); }
  .bubble { background:#f3effa; border-radius:12px; padding:12px 14px; margin-bottom:12px; }
  .bubble::before { content:"💬 "; }
  .tip { background:var(--blue-bg); color:var(--blue); border-radius:10px; padding:10px 14px; margin-top:12px; }
  .tip::before { content:"💡 "; }
  .steps { list-style:none; padding:0; margin:0; counter-reset:s; }
  .step { border:1px solid var(--line); border-radius:12px; padding:12px 14px 12px 52px; margin-bottom:10px; position:relative; transition:.2s; }
  .step::before { counter-increment:s; content:counter(s); position:absolute; left:14px; top:12px; width:26px; height:26px; border-radius:50%; background:#eef2ef; display:grid; place-items:center; font-size:13px; font-weight:600; }
  .step.active { border-color:var(--green); box-shadow:0 0 0 3px #e3f3e9; }
  .step.done::before { content:"✓"; background:var(--green); color:#fff; }
  .step.failed::before { content:"!"; background:var(--amber); color:#fff; }
  .cmd { font-family:ui-monospace,Consolas,monospace; font-size:14px; background:#f4f6f5; padding:2px 8px; border-radius:6px; }
  .why { color:var(--mute); font-size:14px; margin-top:4px; min-height:1.2em; }
  .badge { font-size:11px; padding:2px 8px; border-radius:999px; margin-left:6px; vertical-align:middle; }
  .b-safe { background:var(--green-bg); color:var(--green); } .b-normal { background:#eef2ef; color:var(--mute); }
  .b-careful { background:var(--amber-bg); color:var(--amber); } .b-dangerous { background:var(--red-bg); color:var(--red); }
  .ask { margin-top:10px; display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
  .ask .hint { width:100%; font-size:14px; color:var(--amber); }
  details { margin-top:8px; font-size:13px; color:var(--mute); }
  pre { margin:0; font:13px/1.45 ui-monospace,Consolas,monospace; white-space:pre-wrap; word-break:break-word; }
  details pre { background:#1f2a24; color:#dfe9e2; padding:10px; border-radius:8px; margin-top:6px; max-height:220px; overflow:auto; }
  .skeleton { display:inline-block; height:10px; width:60%; border-radius:6px; background:linear-gradient(90deg,#eef2ef,#f7f9f8,#eef2ef); background-size:200% 100%; animation:sh 1.2s infinite; }
  @keyframes sh { to { background-position:-200% 0; } }
  .thinking { color:var(--mute); font-size:14px; display:flex; align-items:center; gap:8px; margin:6px 0 12px; }
  .spin { width:14px; height:14px; border:2px solid #cfe0d5; border-top-color:var(--green); border-radius:50%; animation:sp .8s linear infinite; display:inline-block; }
  @keyframes sp { to { transform:rotate(360deg); } }
  .versions { display:grid; grid-template-columns:1fr 1fr; gap:12px; margin:12px 0; }
  .ver { border-radius:12px; padding:10px 12px; border:1px solid var(--line); }
  .ver h3 { margin:0 0 6px; font-size:14px; }
  .ver.mine { background:var(--green-bg); border-color:#cbe8d6; } .ver.mine h3 { color:var(--green); }
  .ver.theirs { background:var(--blue-bg); border-color:#cfe0f3; } .ver.theirs h3 { color:var(--blue); }
  .ver.base { grid-column:1/-1; background:#f7f8f7; color:var(--mute); }
  .explain p { margin:4px 0; } .explain .you { color:var(--green); } .explain .them { color:var(--blue); } .explain .note { color:var(--mute); }
  .choices { display:flex; gap:8px; flex-wrap:wrap; margin-top:10px; }
  .choices button.picked { background:var(--green); color:#fff; border-color:var(--green); }
  .picks { display:grid; gap:8px; width:100%; }
  .picks button { text-align:left; } .picks button span { display:block; font-size:13px; color:var(--mute); }
  .banner { text-align:center; font-size:22px; padding:22px; background:var(--green-bg); color:var(--green); border-radius:var(--radius); margin-bottom:16px; }
  .modal { position:fixed; inset:0; background:rgba(20,30,25,.35); display:none; place-items:center; z-index:10; }
  .modal.open { display:grid; }
  .modal .box { background:#fff; width:min(620px,92vw); max-height:80vh; border-radius:var(--radius); padding:18px; display:flex; flex-direction:column; }
  .dirlist { overflow:auto; border:1px solid var(--line); border-radius:10px; margin:10px 0; flex:1; min-height:200px; }
  .dir { padding:9px 14px; cursor:pointer; border-bottom:1px solid #f0f3f1; display:flex; justify-content:space-between; }
  .dir:hover { background:#f6f9f7; }
  .dir .git { font-size:12px; color:var(--green); }
  .muted { color:var(--mute); font-size:14px; }
  @media (max-width:640px) { .versions { grid-template-columns:1fr; } }

  /* ---------- friendly, bouncy motion ---------- */
  :root { --bounce:cubic-bezier(.34,1.56,.64,1); }
  @keyframes pop { 0% { opacity:0; transform:translateY(12px) scale(.96); } 100% { opacity:1; transform:none; } }
  .card, .msg, .banner, .bubble, .tip, .step, .ask, .thinking { animation:pop .45s var(--bounce) both; }
  button { transition:transform .15s var(--bounce), box-shadow .15s, background .15s; }
  button:hover:not(:disabled) { transform:translateY(-2px); box-shadow:0 4px 10px rgba(30,60,40,.08); }
  button:active:not(:disabled) { transform:scale(.95); box-shadow:none; }
  #logo { display:inline-block; transform-origin:50% 90%; animation:sway 4s ease-in-out infinite; }
  body.busy #logo { animation-duration:1.1s; }
  @keyframes sway { 0%,100% { transform:rotate(-6deg); } 50% { transform:rotate(6deg); } }
  .banner { position:relative; overflow:visible; animation:bounceIn .7s var(--bounce) both; }
  @keyframes bounceIn { 0% { opacity:0; transform:scale(.6); } 60% { opacity:1; transform:scale(1.06); } 100% { transform:none; } }
  .confetti { position:absolute; left:50%; top:50%; font-size:20px; pointer-events:none; animation:fly 1.1s cubic-bezier(.2,.8,.3,1) forwards; }
  @keyframes fly { 0% { transform:translate(-50%,-50%) scale(.4); opacity:1; } 100% { transform:translate(calc(-50% + var(--x)), calc(-50% + var(--y))) rotate(var(--r)) scale(1); opacity:0; } }
  .step.done::before { animation:checkPop .5s var(--bounce); }
  @keyframes checkPop { 0% { transform:scale(.3); } 70% { transform:scale(1.25); } 100% { transform:scale(1); } }
  .banner.stop, .warn.block, .shake { animation:shake .5s ease both; }
  @keyframes shake { 0%,100% { transform:none; } 20% { transform:translateX(-7px); } 40% { transform:translateX(6px); } 60% { transform:translateX(-4px); } 80% { transform:translateX(2px); } }
  .dots { display:inline-flex; gap:4px; }
  .dots i { width:7px; height:7px; border-radius:50%; background:var(--green); animation:hop 1s ease-in-out infinite; }
  .dots i:nth-child(2) { animation-delay:.15s; } .dots i:nth-child(3) { animation-delay:.3s; }
  @keyframes hop { 0%,60%,100% { transform:translateY(0); opacity:.5; } 30% { transform:translateY(-6px); opacity:1; } }
  .thinking .secs { font-variant-numeric:tabular-nums; opacity:.8; }
  .thinking .slow { width:100%; font-size:13px; margin-left:22px; }
  .thinking { flex-wrap:wrap; }
  .typing::after { content:"▍"; color:var(--green); margin-left:1px; animation:blink 1s steps(1) infinite; }
  @keyframes blink { 50% { opacity:0; } }
  .card.blocker { background:var(--amber-bg); border-color:#f1d9a6; }
  .card.blocker h2 { color:var(--amber); text-transform:none; letter-spacing:0; font-size:17px; }
  .card.blocker .files { margin:8px 0; padding-left:22px; font-family:ui-monospace,Consolas,monospace; font-size:14px; }
  /* Learn quiz */
  .quiz .q { font-size:18px; font-weight:600; margin:6px 0 12px; }
  .quiz .opts { display:grid; gap:8px; }
  .quiz .opts button { text-align:left; padding:12px 14px; }
  .quiz .opts button:disabled { opacity:1; }
  .quiz .opts button:disabled:not(.right):not(.wrong) { opacity:.55; }
  .quiz .opts button.right { background:var(--green-bg); border-color:var(--green); color:var(--green); animation:checkPop .45s var(--bounce); }
  .quiz .opts button.wrong { background:var(--red-bg); border-color:var(--red); color:var(--red); animation:shake .45s ease; }
  .quiz .bar { height:8px; background:#eef2ef; border-radius:99px; overflow:hidden; margin-bottom:10px; }
  .quiz .bar div { height:100%; background:var(--green); border-radius:99px; transition:width .5s var(--bounce); }
  .quiz .stars { position:relative; font-size:40px; letter-spacing:6px; text-align:center; margin:8px 0; }
  .quiz .stars span { display:inline-block; animation:bounceIn .6s var(--bounce) both; }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation:none !important; transition:none !important; } }
</style>
</head>
<body>
<header>
  <div style="font-size:28px"><span id="logo">🌿</span></div>
  <div><h1>Ask Iche</h1><div class="sub">Your friendly git buddy. Nothing runs until you say so.</div></div>
  <button class="pill" id="resetBtn" title="Stop anything that is running and start fresh" style="margin-left:auto;background:#fff;border:1px solid var(--line);color:var(--mute)">🔄 Reset</button>
  <button class="pill" id="aiPill" style="margin-left:8px" title="Turn the AI explanations on or off">…</button>
</header>

<main>
  <section class="card">
    <h2>1. Your project</h2>
    <div class="row">
      <input type="text" id="repo" placeholder="Pick your project folder…" spellcheck="false">
      <button id="browse">📁 Browse…</button>
    </div>
    <div class="chips" id="recent"></div>
  </section>

  <section class="card">
    <h2>2. What do you want to do?</h2>
    <div class="actions">
      <button class="action" data-intent="status"><b>📍 Where am I?</b><span>See what's going on</span></button>
      <button class="action" data-intent="save"><b>💾 Save my work</b><span>Commit your changes</span></button>
      <button class="action" data-intent="push"><b>⬆️ Upload my work</b><span>Push to GitHub safely</span></button>
      <button class="action" data-intent="pull"><b>⬇️ Get latest</b><span>Pull your team's changes</span></button>
      <button class="action" data-intent="resolve"><b>🤝 Fix a conflict</b><span>Pick which version to keep</span></button>
    </div>
    <div class="muted" style="margin:4px 2px 8px">More git tools</div>
    <div class="actions">
      <button class="action" data-intent="stash"><b>📦 Stash my work</b><span>Put unfinished work aside</span></button>
      <button class="action" data-intent="stash-list"><b>🗂️ My stashes</b><span>See what you put aside</span></button>
      <button class="action" data-intent="unstash"><b>📤 Bring back stashed work</b><span>Pop a stash by number or name</span></button>
      <button class="action" data-intent="reset"><b>↩️ Undo commits</b><span>Soft, mixed or hard reset</span></button>
      <button class="action" data-intent="rebase"><b>🧹 Clean up for review</b><span>Rebase on main, squash</span></button>
      <button class="action" data-intent="cherry-pick"><b>🍒 Copy a commit</b><span>Cherry-pick from a branch</span></button>
      <button class="action" data-intent="branch"><b>🌿 Branches</b><span>Switch, create, rename, delete</span></button>
      <button class="action" data-intent="log"><b>📜 History</b><span>See commits (git log)</span></button>
      <button class="action" id="learnBtn"><b>🎓 Learn mode</b><span>A tiny 5-question git quiz</span></button>
    </div>
    <div class="row">
      <input type="text" id="said" placeholder='Or just tell me what happened, e.g. "my push got rejected"'>
      <button class="primary" id="askBtn">Ask</button>
    </div>
    <div id="intentAsk"></div>
  </section>

  <section id="timeline"></section>
</main>

<div class="modal" id="modal">
  <div class="box">
    <b>Pick your project folder</b>
    <div class="muted" id="curDir"></div>
    <div class="dirlist" id="dirlist"></div>
    <div class="row">
      <button id="upDir">⬆ Up</button>
      <span class="muted" style="flex:1">Folders marked <span style="color:var(--green)">● git project</span> are ready to use.</span>
      <button class="ghost" id="closeModal">Cancel</button>
      <button class="primary" id="pickDir">Use this folder</button>
    </div>
  </div>
</div>

<script>
const TOKEN = "__TOKEN__";
const $ = s => document.querySelector(s);
const api = (path, data) => fetch("/api/" + path, data === undefined
  ? { headers: { "x-token": TOKEN } }
  : { method: "POST", headers: { "x-token": TOKEN, "Content-Type": "application/json" }, body: JSON.stringify(data) }).then(r => r.json());
function el(tag, props = {}, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(props)) {
    if (k === "class") e.className = v; else if (k.startsWith("on")) e.addEventListener(k.slice(2), v); else if (v !== undefined && v !== null) e.setAttribute(k, v);
  }
  for (const k of kids.flat()) if (k !== null && k !== undefined && k !== false) e.append(k instanceof Node ? k : document.createTextNode(String(k)));
  return e;
}
const tl = $("#timeline");
const RISK = { safe: "safe", normal: "needs your OK", careful: "careful", dangerous: "danger" };
const DONE = { stash: "📦 Stashed! Your work is safe in your stash list.", unstash: "📤 Your stashed work is back in your files.",
  save: "💾 Saved! Your work is in a commit.", reset: "↩️ Done. Those commits are undone.", rebase: "🧹 Your branch is clean and ready for review.",
  "cherry-pick": "🍒 Done. The commit is copied onto your branch.", branch: "🌿 Done! Check again to see where you are.", log: "📜 That's the history. Nothing was changed." };
let curIntent = null, lastDone = null;
let busy = false, plan = null, conflictCard = null, thinkingEl = null, runningStep = null;
const showStats = new URLSearchParams(location.search).has("stats");

// ---------- project folder ----------
const recent = () => JSON.parse(localStorage.getItem("recent") || "[]");
function setRepo(p, go = true) {
  $("#repo").value = p;
  localStorage.setItem("recent", JSON.stringify([p, ...recent().filter(x => x !== p)].slice(0, 5)));
  drawRecent();
  if (go && !busy) start("status");
}
function drawRecent() {
  const box = $("#recent"); box.replaceChildren();
  for (const p of recent()) box.append(el("span", { class: "chip", title: p, onclick: () => setRepo(p) }, "📂 " + p.split(/[\\/]/).filter(Boolean).pop()));
}
let cur = null;
async function openDir(p) {
  const d = await api("dirs?path=" + encodeURIComponent(p || ""));
  cur = d; $("#curDir").textContent = d.path + (d.isRepo ? "  ● git project" : "");
  const list = $("#dirlist"); list.replaceChildren();
  if (d.error) list.append(el("div", { class: "dir" }, d.error));
  for (const x of d.dirs) list.append(el("div", { class: "dir", ondblclick: () => x.isRepo ? (closeModal(), setRepo(x.path)) : openDir(x.path), onclick: () => openDir(x.path) },
    el("span", {}, "📁 " + x.name), x.isRepo ? el("span", { class: "git" }, "● git project") : ""));
  if (!d.dirs.length && !d.error) list.append(el("div", { class: "dir muted" }, "No folders here."));
}
const closeModal = () => $("#modal").classList.remove("open");
$("#browse").onclick = () => { $("#modal").classList.add("open"); openDir($("#repo").value || ""); };
$("#upDir").onclick = () => cur?.parent && openDir(cur.parent);
$("#closeModal").onclick = closeModal;
$("#pickDir").onclick = () => { if (cur) { closeModal(); setRepo(cur.path); } };
$("#repo").addEventListener("keydown", e => { if (e.key === "Enter" && $("#repo").value.trim()) setRepo($("#repo").value.trim()); });

// ---------- Reset: stop everything, start nothing ----------
$("#resetBtn").onclick = async () => {
  await api("stop", { force: true });
  tl.replaceChildren(el("div", { class: "msg info" }, "🔄 Fresh start. Nothing is running. Pick a button when you're ready."));
  setBusy(false);
};

// ---------- AI pill ----------
async function drawAI(info) {
  info = info || await api("info");
  const p = $("#aiPill");
  if (!info.useAI) { p.className = "pill off"; p.textContent = "AI off · built-in help"; }
  else if (info.aiUp && info.hasModel) { p.className = "pill"; p.textContent = "✓ Gemma on your laptop"; }
  else { p.className = "pill off"; p.textContent = info.aiUp ? "Model missing · built-in help" : "Ollama not running · built-in help"; }
  p.dataset.on = info.useAI ? "1" : "";
}
$("#aiPill").onclick = async () => drawAI({ ...(await api("ai", { on: !$("#aiPill").dataset.on })) });

// ---------- start a run ----------
function setBusy(b) { busy = b; document.body.classList.toggle("busy", b); document.querySelectorAll(".action,#askBtn").forEach(x => x.disabled = b); }
async function start(intent, values) {
  const path = $("#repo").value.trim();
  if (!path) { $("#browse").click(); return; }
  $("#intentAsk").replaceChildren();
  const r = await api("run", { path, intent, values });
  if (r.error && /already working/i.test(r.error)) { // something from before is still running (maybe in another tab)
    tl.querySelectorAll(".msg.stuck").forEach(x => x.remove());
    const box = el("div", { class: "msg error stuck" }, "Iche is still busy with something from before (maybe in another tab). ",
      el("button", { style: "margin-left:8px", onclick: async () => { box.remove(); await api("stop", { force: true }); start(intent, values); } }, "⏹ Stop it and start this"));
    tl.prepend(box); return;
  }
  if (r.error) tl.prepend(el("div", { class: "msg error" }, r.error));
}
document.querySelectorAll(".action[data-intent]").forEach(b => b.onclick = () => start(b.dataset.intent));
async function askText() {
  const text = $("#said").value.trim(); if (!text) return;
  const box = $("#intentAsk"); box.replaceChildren(el("div", { class: "thinking" }, el("span", { class: "spin" }), "Understanding what you mean…"));
  const r = await api("intent", { text });
  if (r.refused) return box.replaceChildren(el("div", { class: r.blocked ? "msg error" : "msg warn" }, r.refused, r.blocked ? el("div", { style: "margin-top:6px;font-size:13px" }, "Nothing was run.") : ""));
  if (!r.intent) return box.replaceChildren(el("div", { class: "msg warn" }, `I'm not sure what you want to do with "${text}". Nothing was changed. Try one of the buttons above.`));
  if (r.direct) return start(r.intent, r.values);
  box.replaceChildren(el("div", { class: "msg info" }, "Sounds like you want to ", el("b", {}, r.words), ". Right?  ",
    el("button", { class: "primary", onclick: () => start(r.intent) }, "Yes"), " ",
    el("button", { onclick: () => box.replaceChildren() }, "No")));
}
$("#askBtn").onclick = askText;
$("#said").addEventListener("keydown", e => { if (e.key === "Enter") askText(); });

// ---------- answering questions ----------
const answer = (id, value) => api("answer", { id, value });
const stopBtn = id => el("button", { class: "ghost", onclick: () => answer(id, null) }, "Stop");

// ---------- render events ----------
// "Iche is thinking…" with hopping dots and a seconds counter. On a CPU laptop the first answer can be slow.
function makeThinking(text, slowNote) {
  const secs = el("span", { class: "secs" }), t0 = Date.now();
  const box = el("div", { class: "thinking" }, el("span", { class: "dots" }, el("i"), el("i"), el("i")), text, secs);
  box._timer = setInterval(() => {
    const s = Math.round((Date.now() - t0) / 1000);
    if (s >= 3) secs.textContent = `· ${s}s`;
    if (s === 15 && slowNote) box.append(el("div", { class: "slow" }, slowNote));
  }, 1000);
  return box;
}
function dropThinking(box) { if (box) { clearInterval(box._timer); box.remove(); } }
function stopThinking() { dropThinking(thinkingEl); thinkingEl = null; }
const typingOff = () => plan?.card?.querySelectorAll(".typing").forEach(x => x.classList.remove("typing"));
const stale = ev => ev.seq !== undefined && plan?.seq !== ev.seq; // words for an older plan: ignore
function celebrate(banner) {
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const bits = ["🎉", "🌿", "✨", "💚", "🎊", "⭐"];
  for (let i = 0; i < 14; i++) {
    const a = (Math.PI * 2 * i) / 14, d = 90 + Math.random() * 70;
    const c = el("span", { class: "confetti", style: `--x:${Math.cos(a) * d * 1.6}px;--y:${Math.sin(a) * d}px;--r:${Math.random() * 360 - 180}deg` }, bits[i % bits.length]);
    banner.append(c); setTimeout(() => c.remove(), 1200);
  }
}
function doneBanner(text) { const b = el("div", { class: "banner" }, text); tl.append(b); celebrate(b); return b; }
function card(title, ...kids) { const c = el("div", { class: "card" }, title ? el("h2", {}, title) : null, ...kids); tl.append(c); c.scrollIntoView({ behavior: "smooth", block: "nearest" }); return c; }
const questions = new Map(); // id -> element to remove when answered

function render(ev) {
  switch (ev.type) {
    case "start":
      dropThinking(plan?.thinkEl); stopThinking();
      tl.replaceChildren(); plan = null; conflictCard = null; setBusy(true); curIntent = ev.intent;
      tl.append(el("div", { class: "muted", style: "margin:4px 4px 12px" }, `You asked to ${ev.words} in ${ev.path}`)); break;
    case "show":
      card(ev.round === 1 ? "📍 Here's where you are" : "🔄 Checking again…",
        el("ul", { class: "facts" }, ev.facts.map(f => el("li", {}, f))), ev.warnings.map(w => w.startsWith("🚫") ? el("div", { class: "warn block" }, w) : el("div", { class: "warn" }, "⚠️ " + w))); break;
    case "blocked": plan = { steps: [], blocked: true }; break;
    case "plan": {
      dropThinking(plan?.thinkEl);
      const steps = ev.steps.map((s, i) => {
        const li = el("li", { class: "step", style: `animation-delay:${0.15 + i * 0.08}s` },
          s.manual ? el("b", {}, s.display) : el("span", { class: "cmd" }, s.display),
          el("span", { class: "badge b-" + s.risk }, RISK[s.risk] || s.risk),
          el("div", { class: "why" }, el("span", { class: "skeleton" })), el("div", { class: "slot" }));
        return li;
      });
      const summary = el("div", { class: "bubble", style: "display:none" });
      const c = card(ev.steps.length ? "🗺️ The plan" : ev.hint ? "📋 Summary" : "✨ All good", summary, ev.steps.length ? el("ol", { class: "steps" }, steps) : null);
      plan = { seq: ev.seq, card: c, steps, summary, hint: ev.hint, thinkEl: null, tipEl: null }; break;
    }
    case "thinking":
      if (ev.seq !== undefined) { // the plan's words: the Run buttons don't wait for these
        if (stale(ev) || !plan) break;
        dropThinking(plan.thinkEl);
        plan.thinkEl = makeThinking(ev.text, "The first answer can take about 30 seconds on this laptop. The plan above is already safe to run.");
        plan.summary.before(plan.thinkEl); break;
      }
      stopThinking(); thinkingEl = makeThinking(ev.text, "Still reading. Gemma runs on your laptop, so this can take a little while.");
      (conflictCard?.explain && !conflictCard.done ? conflictCard.explain : plan?.summary)?.before(thinkingEl); break;
    case "thinking-done":
      if (ev.seq !== undefined) {
        if (stale(ev)) break;
        dropThinking(plan?.thinkEl); if (plan) plan.thinkEl = null; typingOff();
        if (showStats && ev.stats?.totalMs) plan?.card.append(el("div", { class: "muted" }, `[first words ${(ev.stats.firstTokenMs / 1000).toFixed(1)}s, total ${(ev.stats.totalMs / 1000).toFixed(1)}s${ev.fellBack ? ", filled " + ev.fellBack + " from built-in" : ""}]`));
        break;
      }
      stopThinking();
      const wasConflict = conflictCard && !conflictCard.done;
      if (wasConflict) conflictCard.done = true;
      if (showStats && ev.stats && wasConflict) { conflictCard.explain.append(el("div", { class: "muted" }, `[first words ${(ev.stats.firstTokenMs / 1000).toFixed(1)}s, total ${(ev.stats.totalMs / 1000).toFixed(1)}s]`)); break; }
      if (showStats && ev.stats) (plan?.card || tl).append(el("div", { class: "muted" }, `[first words ${(ev.stats.firstTokenMs / 1000).toFixed(1)}s, total ${(ev.stats.totalMs / 1000).toFixed(1)}s${ev.fellBack ? ", filled " + ev.fellBack + " from built-in" : ""}]`));
      break;
    case "partial": { // Gemma's words as they arrive, with a typing caret
      if (stale(ev) || !plan) break;
      let t = null;
      if (ev.key === "summary") { t = plan.summary; t.style.display = ""; }
      else if (ev.key === "reason") t = plan.steps[ev.index]?.querySelector(".why");
      else if (ev.key === "tip") t = plan.tipEl ||= plan.card.appendChild(el("div", { class: "tip" }));
      if (t) { t.textContent = ev.text; t.classList.add("typing"); }
      break;
    }
    case "summary": if (plan && !stale(ev)) { plan.summary.style.display = ""; plan.summary.textContent = ev.text; plan.summary.classList.remove("typing"); } break;
    case "reason": if (!stale(ev) && plan?.steps[ev.index]) { const w = plan.steps[ev.index].querySelector(".why"); w.textContent = ev.text; w.classList.remove("typing"); } break;
    case "tip": if (plan && !stale(ev)) { const t = plan.tipEl ||= plan.card.appendChild(el("div", { class: "tip" })); t.textContent = ev.text; t.classList.remove("typing"); } break;
    case "confirm": {
      const m = ev.meta || {}; let box;
      if (m.kind === "step" || m.kind === "manual") {
        const li = plan?.steps[m.index]; li?.classList.add("active");
        if (m.kind === "manual") box = el("div", { class: "ask" }, el("button", { class: "primary", onclick: () => answer(ev.id, true) }, "I've fixed it"), stopBtn(ev.id));
        else if (ev.strict) {
          const inp = el("input", { type: "text", placeholder: 'Type "yes" to run it' });
          box = el("div", { class: "ask" }, el("div", { class: "hint" }, "⚠️ " + (m.warning || "Be careful with this one.")), inp,
            el("button", { class: "danger", onclick: () => answer(ev.id, inp.value) }, "Run"), stopBtn(ev.id));
        } else box = el("div", { class: "ask" }, el("button", { class: "primary", onclick: () => answer(ev.id, true) }, "▶ Run this step"), stopBtn(ev.id));
        (li?.querySelector(".slot") || tl).append(box); li?.scrollIntoView({ behavior: "smooth", block: "center" });
      } else if (m.kind === "save") {
        box = el("div", { class: "ask" }, el("button", { class: "primary", onclick: () => answer(ev.id, true) }, `💾 Save ${m.file}`), stopBtn(ev.id));
        (conflictCard?.card || tl).append(box);
      } else {
        box = el("div", { class: "ask" }, ev.prompt, el("button", { class: "primary", onclick: () => answer(ev.id, true) }, "Yes"), stopBtn(ev.id)); tl.append(box);
      }
      questions.set(ev.id, box); break;
    }
    case "ask": {
      const m = ev.meta || {}; let box;
      if (m.kind === "choice" && conflictCard) {
        conflictCard.buttons.forEach((b, n) => { b.disabled = false; b.onclick = () => { b.classList.add("picked"); answer(ev.id, String(n + 1)); }; });
        box = el("span"); questions.set(ev.id, box); conflictCard.buttons.at(-1).scrollIntoView({ behavior: "smooth", block: "center" }); break;
      }
      if (m.kind === "pick") {
        const typed = m.typed ? el("input", { type: "text", placeholder: m.byValue ? "or type the stash number or name" : "or type it" }) : null;
        const sendTyped = () => typed.value.trim() && answer(ev.id, typed.value.trim());
        typed?.addEventListener("keydown", e => { if (e.key === "Enter") sendTyped(); });
        const bl = m.blocker; // git refused: show why, which files, then the ways out
        box = card(bl ? bl.title : "🤔 Your choice",
          bl ? el("div", {}, bl.text) : null,
          bl?.files?.length ? el("ul", { class: "files" }, bl.files.map(f => el("li", {}, f))) : null,
          el("b", {}, ev.prompt), m.note ? el("div", { class: "muted" }, m.note) : null,
          el("div", { class: "picks", style: "margin-top:10px" }, m.options.map((o, n) =>
            el("button", { onclick: () => answer(ev.id, m.byValue ? o.value : String(n + 1)) }, el("b", {}, o.label), o.hint ? el("span", {}, o.hint) : null))),
          el("div", { class: "ask" }, typed, typed ? el("button", { onclick: sendTyped }, "OK") : null, stopBtn(ev.id)));
        if (bl) box.classList.add("blocker", "shake");
        box._pick = v => (m.options.find((o, n) => (m.byValue ? o.value : String(n + 1)) === String(v)) || m.options.find(o => o.value === v || (o.aliases || []).includes(v)) || { label: v }).label;
        questions.set(ev.id, box); break;
      }
      const li = plan?.steps[m.index];
      const label = ev.prompt.replace(/\(commit message\):?/i, "").replace(/:$/, "").trim();
      const inp = el("input", { type: "text", placeholder: m.name === "message" ? "e.g. Add login screen" : m.name === "stashName" ? "e.g. login-form-wip" : "" });
      const send = () => answer(ev.id, inp.value);
      inp.addEventListener("keydown", e => { if (e.key === "Enter") send(); });
      box = el("div", { class: "ask" }, el("div", { style: "width:100%" }, el("b", {}, label)), inp, el("button", { class: "primary", onclick: send }, "OK"), stopBtn(ev.id));
      (li?.querySelector(".slot") || tl).append(box); setTimeout(() => inp.focus(), 50);
      questions.set(ev.id, box); break;
    }
    case "answered": { const q = questions.get(ev.id); questions.delete(ev.id);
      if (q?._pick) { if (ev.value === null || ev.value === undefined) q.remove(); else q.replaceChildren(el("div", { class: "msg ok", style: "margin:0" }, "✓ You picked: " + q._pick(ev.value))); }
      else q?.remove();
      conflictCard?.buttons.forEach(b => b.disabled = true); break; }
    case "running": {
      const li = plan?.steps[ev.index]; runningStep = li;
      if (li) { li.classList.add("active"); const c = li.querySelector(".cmd"); if (c) c.textContent = ev.cmd; li.querySelector(".slot").append(el("div", { class: "thinking run" }, el("span", { class: "spin" }), "Running…"),
        el("details", {}, el("summary", {}, "Show git output"), el("pre", {}))); }
      break;
    }
    case "output": runningStep?.querySelector("details pre")?.append(ev.text); break;
    case "say": {
      if (ev.text === "✓ done" && runningStep) { const pre = runningStep.querySelector("details pre"); if (pre && !pre.textContent.trim()) pre.textContent = "(git printed nothing. That's normal for this step. It worked.)"; runningStep.classList.remove("active"); runningStep.classList.add("done"); runningStep.querySelector(".run")?.remove(); runningStep = null; break; }
      if (runningStep && ev.kind === "warn") { runningStep.classList.remove("active"); runningStep.classList.add("failed"); runningStep.querySelector(".run")?.remove(); runningStep = null; }
      if (/^Step \d+: /.test(ev.text)) break; // the plan card already shows this
      if (ev.text.startsWith("All done")) { lastDone = doneBanner(DONE[curIntent] || "🎉 All done! Your work is safe and in sync."); break; }
      if (ev.text.startsWith("✓ Both versions") && plan) { // auto-saved: show it on the "Choose which version" step
        const li = plan.steps.find(li => !li.classList.contains("done"));
        if (li) { (li.querySelector(".slot") || li).append(el("div", { class: "msg ok" }, ev.text)); li.classList.add("done"); break; } }
      if (ev.text.startsWith("✓ Saved") && conflictCard) {
        conflictCard.card.append(el("div", { class: "msg ok" }, ev.text));
        plan?.steps.find(li => li.querySelector("b") && !li.classList.contains("done"))?.classList.add("done"); break; }
      tl.append(el("div", { class: "msg " + (ev.kind || "info") }, ev.text)); break;
    }
    case "conflict": {
      const buttons = [...ev.choices, "I'll fix it myself in my editor"].map(t => el("button", { disabled: true }, t));
      const explain = el("div", { class: "explain" });
      const c = card(`🤝 Conflict ${ev.index + 1} of ${ev.total} · ${ev.file} (around line ${ev.line})`,
        el("p", { class: "muted", style: "margin-top:0" }, /stash/.test(ev.labels.theirs) ? "Your stash and your latest code changed the same lines. Nothing is lost. Just pick what to keep." : "You and a teammate changed the same lines. Nothing is lost. Just pick what to keep."),
        el("div", { class: "versions" },
          ev.base.trim() ? el("div", { class: "ver base" }, el("h3", {}, "Before anyone changed it"), el("pre", {}, ev.base)) : null,
          el("div", { class: "ver mine" }, el("h3", {}, `① Yours (${ev.labels.mine})`), el("pre", {}, ev.mine || "(nothing, this part was removed)")),
          el("div", { class: "ver theirs" }, el("h3", {}, `② Theirs (${ev.labels.theirs})`), el("pre", {}, ev.theirs || "(nothing, this part was removed)"))),
        explain, el("b", {}, "What do you want to keep?"), el("div", { class: "choices" }, buttons));
      conflictCard = { card: c, buttons, explain, done: false }; break;
    }
    case "conflict-line":
      conflictCard?.explain.append(el("p", { class: ev.key }, ev.key === "you" ? "💬 You: " : ev.key === "them" ? "     Them: " : "     Note: ", ev.text)); break;
    case "resolved":
      conflictCard?.card.append(el("div", { style: "margin-top:12px" }, el("b", {}, `Here's how ${ev.file} will look:`),
        ...ev.picked.map(t => el("pre", { style: "background:#f4f6f5;padding:10px;border-radius:8px;margin-top:6px" }, t || "(empty)")))); break;
    case "end":
      setBusy(false); stopThinking();
      if (ev.ok && curIntent === "branch" && ev.branch && /^(switch|new-branch)/.test(ev.situation || "") && lastDone) lastDone.firstChild.textContent = `🌿 You're on ${ev.branch} now.`;
      if (ev.ok && lastDone && ev.situation === "delete-all-backups") lastDone.firstChild.textContent = "🧹 Old backups deleted. Your branches are tidy.";
      if (ev.ok && lastDone && /^delete-(remote-)?branch$/.test(ev.situation || "")) lastDone.firstChild.textContent = "🗑️ Deleted. Your branch list is tidier.";
      lastDone = null;
      if (plan?.blocked) tl.append(el("div", { class: "banner stop" }, "🚫 Nothing was run. This one stays off-limits to protect your work."));
      else if (ev.ok && plan && !plan.steps.length) tl.append(plan.hint ? el("div", { class: "msg warn", style: "font-size:17px;padding:16px" }, "👉 " + plan.hint) : doneBanner("✓ Nothing to do. You're all set!"));
      tl.append(el("div", { class: "row", style: "justify-content:center;margin-top:8px" },
        el("button", { onclick: () => start("status") }, "📍 Check again"))); break;
  }
}

// ---------- 🎓 Learn mode: a tiny quiz (runs only in this page, touches nothing) ----------
const QUIZ = [
  { q: "You changed some files. Which button keeps them safe as a commit on your laptop?", a: ["💾 Save my work", "⬆️ Upload my work", "📦 Stash my work"], why: "Save = git commit, a snapshot on your laptop. Upload sends your commits to GitHub." },
  { q: "Your upload got rejected because a teammate pushed first. What do you do?", a: ["⬇️ Get latest, then upload again", "Force push over their work", "Delete your branch"], why: "Get their commits first, then upload. Iche never force pushes, because that can wipe out a teammate's work." },
  { q: "What does 📦 Stash do?", a: ["Puts unfinished work aside so you can bring it back later", "Deletes your changes", "Uploads your changes to GitHub"], why: "A stash is a safe drawer. 📤 Bring back stashed work puts it back in your files." },
  { q: "Git won't let you switch branches because of unsaved changes. Safest move?", a: ["Stash them, switch, then bring them back", "Undo commits with Hard", "Delete the other branch"], why: "Stashing keeps your changes safe while you switch. Nothing is lost." },
  { q: "Which ↩️ Undo keeps your changes ready to commit again (staged)?", a: ["Soft", "Hard", "None of them"], why: "Soft keeps changes staged, Mixed keeps them in your files, Hard throws them away. Iche makes a backup before Hard." },
  { q: "A merge conflict means…", a: ["You and a teammate changed the same lines, and git needs you to pick", "Your code is broken", "GitHub is down"], why: "Nothing is lost. 🤝 Fix a conflict shows both versions side by side so you can choose." },
  { q: "What is “origin”?", a: ["The copy of your project on GitHub", "Your very first commit", "Another name for main"], why: "origin is the remote, the GitHub copy. origin/main is GitHub's main." },
  { q: "Why does Iche refuse git push --force?", a: ["It can erase your teammates' work on GitHub", "It's too slow", "It needs a password"], why: "Force push replaces GitHub's history with yours. Iche keeps that off-limits." },
  { q: "🍒 Copy a commit (cherry-pick) is for…", a: ["Bringing one specific commit onto your branch", "Copying a whole branch", "Backing up your laptop"], why: "Cherry-pick copies just that one commit, nothing else." },
  { q: "Before 🧹 Clean up for review (rebase), what should be true?", a: ["All your work is saved, with no unsaved changes", "You deleted main", "You force pushed"], why: "Rebase rewrites your commits, so save or stash first. Iche checks this for you." },
  { q: "Deleting a ☁️ branch on GitHub…", a: ["Removes it for everyone, so Iche keeps a safety copy on your laptop first", "Only removes it from your laptop", "Is how you rename a branch"], why: "☁️ means GitHub's copy. Iche never deletes shared ones like main." },
  { q: "Where does Gemma, Iche's brain, run?", a: ["On your laptop, so nothing leaves it", "In the cloud", "On GitHub"], why: "Gemma runs locally through Ollama. Your code stays on your machine." },
  { q: "“Your branch is behind by 3 commits” means…", a: ["GitHub has 3 commits you don't have yet", "You have 3 commits to upload", "3 files have conflicts"], why: "Behind = they have new work. ⬇️ Get latest brings it down. Ahead = you have work to upload." },
  { q: "What does 📜 History change in your project?", a: ["Nothing, it only shows your commits", "It deletes old commits", "It uploads your commits"], why: "History is read-only: newest commits first, with who and when." },
];
const shuffle = a => a.map(x => [Math.random(), x]).sort((p, q) => p[0] - q[0]).map(x => x[1]);
function learn() {
  if (busy) return;
  const round = shuffle(QUIZ).slice(0, 5); let n = 0, score = 0;
  tl.replaceChildren();
  const body = el("div");
  const c = card("🎓 Learn mode · a tiny git quiz", body);
  c.classList.add("quiz");
  const ask = () => {
    const item = round[n], right = item.a[0];
    const bar = el("div", { class: "bar" }, el("div", { style: `width:${(n / round.length) * 100}%` }));
    const why = el("div");
    const opts = shuffle(item.a).map(t => el("button", { onclick: () => {
      opts.forEach(b => b.disabled = true);
      const ok = t === right; if (ok) score++;
      opts.forEach(b => { if (b.textContent === right) b.classList.add("right"); });
      if (!ok) opts.find(b => b.textContent === t).classList.add("wrong");
      why.replaceChildren(el("div", { class: ok ? "msg ok" : "msg warn", style: "margin-top:12px" }, (ok ? "✅ Yes! " : "❌ Not quite. ") + item.why),
        el("div", { class: "row", style: "justify-content:flex-end" }, el("button", { class: "primary", onclick: () => { n++; n < round.length ? ask() : finish(); } }, n + 1 < round.length ? "Next →" : "See my score")));
    } }, t));
    body.replaceChildren(bar, el("div", { class: "muted" }, `Question ${n + 1} of ${round.length}`), el("div", { class: "q" }, item.q), el("div", { class: "opts" }, opts), why);
  };
  const finish = () => {
    const best = Math.max(score, Number(localStorage.getItem("quizBest") || 0)); localStorage.setItem("quizBest", best);
    const stars = Array.from({ length: 5 }, (_, i) => el("span", { style: `animation-delay:${i * 0.12}s` }, i < score ? "⭐" : "☆"));
    const words = score === 5 ? "Perfect! You're a git pro. 🎉" : score >= 3 ? "Nice work! A couple more rounds and you've got it." : "Good start! Every round teaches you something new.";
    body.replaceChildren(el("div", { class: "bar" }, el("div", { style: "width:100%" })), el("div", { class: "stars" }, stars),
      el("div", { class: "q", style: "text-align:center" }, `${score} out of ${round.length}. ${words}`),
      el("div", { class: "muted", style: "text-align:center" }, `Your best: ${best} / 5`),
      el("div", { class: "row", style: "justify-content:center;margin-top:12px" }, el("button", { class: "primary", onclick: learn }, "🔁 Play again"), el("button", { onclick: () => tl.replaceChildren() }, "Close")));
    if (score >= 3) celebrate(body.querySelector(".stars"));
  };
  ask();
}
$("#learnBtn").onclick = learn;

// ---------- live connection ----------
function connect() {
  const es = new EventSource("/api/events?token=" + TOKEN);
  es.onmessage = m => {
    const ev = JSON.parse(m.data);
    if (ev.type === "replay") { if (ev.events.length) ev.events.forEach(take); setBusy(ev.busy); return; }
    take(ev);
  };
  es.onerror = () => { es.close(); setTimeout(connect, 1500); };
}
// Every update has a number. Live updates and the 1-second check below both feed take(), and each
// update is shown once. So the page keeps up even if something on the laptop holds back live updates.
let lastN = 0, shownError = false;
function take(ev) {
  if (ev._n) { if (ev._n <= lastN) return; lastN = ev._n; }
  try { render(ev); } catch (e) {
    console.error("Ask Iche display error", ev, e);
    if (!shownError) { shownError = true; tl.append(el("div", { class: "msg error" }, `Display problem (${ev.type}): ${e.message}. Press F12 → Console and send Iche a screenshot.`)); }
  }
}
async function poll() {
  try { const r = await api("poll?since=" + lastN); (r.events || []).forEach(take); if (typeof r.busy === "boolean" && r.busy !== busy) setBusy(r.busy); }
  catch {}
  setTimeout(poll, 1000);
}
try { drawRecent(); } catch (e) { console.error(e); localStorage.removeItem("recent"); }
drawAI().catch(e => { console.error(e); $("#aiPill").textContent = "Gemma: couldn't check"; }); connect(); poll();
if (recent()[0]) $("#repo").value = recent()[0];
</script>
